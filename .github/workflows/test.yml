name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS is the primary platform — the ps format, the plist and launchctl all
    # differ there — so it has to be exercised, not assumed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
